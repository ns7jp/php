; ---------------------------------------------------------------------
; 演習14: サンプル設定ファイル
; ---------------------------------------------------------------------
; これは、アプリケーションの設定を保存した「INI形式」のファイルの例です。
; loadConfig() 関数は、このファイルのように実際に存在するファイルを
; 指定された場合は、中身を配列として正しく読み込みます。
;
; [app] や [database] のように [ ] で囲まれた部分を「セクション」と呼び、
; 設定項目をグループ分けするために使います。

[app]
name = "SampleApp"
environment = "production"

[database]
host = "127.0.0.1"
port = 3306
